[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airs-lab"
version = "2.0.0"
description = "AEGIS AI LAB — Enterprise AI Reliability, Security, Inference Arbitrage & Governance Laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
    "jsonschema>=4.20,<5",
    "pyyaml>=6.0,<7",
    "reportlab>=4.2,<5",
]

[project.scripts]
airs = "airs_cli:main"

[tool.setuptools]
py-modules = ["airs_cli"]
