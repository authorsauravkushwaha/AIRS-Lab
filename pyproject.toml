[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airs-lab"
version = "2.1.0"
description = "AEGIS AI LAB — Enterprise AI Reliability, Security, Inference Arbitrage & Governance Laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Saurav Kushwaha" }]
keywords = [
    "llm-evaluation",
    "ai-reliability",
    "ai-security",
    "prompt-injection",
    "owasp-llm",
    "model-governance",
    "ci-cd-gate",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
    "jsonschema>=4.20,<5",
    "pyyaml>=6.0,<7",
    "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<3",
    "types-jsonschema>=4.20",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://authorsauravkushwaha.github.io/AIRS-Lab/"
Repository = "https://github.com/authorsauravkushwaha/AIRS-Lab"
Issues = "https://github.com/authorsauravkushwaha/AIRS-Lab/issues"
Changelog = "https://github.com/authorsauravkushwaha/AIRS-Lab/blob/main/CHANGELOG.md"

[project.scripts]
airs = "airs_cli:main"

[tool.setuptools]
py-modules = ["airs_cli"]

# ---------------------------------------------------------------------------
# Ruff — lint + format (run: ruff check . && ruff format --check .)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".venv",
    "frontend",
    "site",
    "backend/reports_out",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "T20",  # no print() in library code (CLI modules exempt below)
]
ignore = [
    "B008",    # FastAPI Depends()/Query() in defaults is idiomatic
    "SIM108",  # ternaries are not always clearer
    "RUF012",  # ClassVar annotations are noisy for pydantic/SQLAlchemy models
]

[tool.ruff.lint.per-file-ignores]
# CLI entrypoints and scripts legitimately print to stdout.
"airs_cli.py" = ["T20"]
"scripts/*.py" = ["T20"]
"run.py" = ["T20"]
# Legacy demo app keeps its original style; tests need E402 after sys.path setup.
"app/*.py" = ["T20"]
"tests/*.py" = ["E402", "T20"]
"backend/tests/*.py" = ["E402", "T20"]
# Dataset/probe files embed verbatim case prompts and fixture responses whose
# exact text feeds SHA-256 dataset fingerprints — do not rewrap them.
"backend/app/services/domain_packs.py" = ["E501"]
"backend/app/seed.py" = ["E501"]
"backend/app/providers/mock.py" = ["E501"]
"backend/app/services/security_lab.py" = ["E501"]
"app/evaluation.py" = ["E501"]
"app/main.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "airs_cli"]

# ---------------------------------------------------------------------------
# mypy — static type checking (run: mypy backend/app airs_cli.py)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["backend/app", "airs_cli.py"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false  # routers are typed via pydantic; tighten services over time

# ---------------------------------------------------------------------------
# pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# Bare `pytest` (GitHub Pages workflow) must run only the root/site suite.
# The backend suite is invoked explicitly from backend/ in CI, where `tests/`
# resolves to backend/tests — testpaths only applies when no args are given,
# so both invocations keep working.
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
