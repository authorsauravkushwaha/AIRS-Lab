version: 2
updates:
  # Python (root + backend): weekly, grouped minor/patch updates.
  # Constraint-widening majors (e.g. reportlab 4 -> 5) still arrive as
  # individual PRs, capped at 3 open, so each is reviewed deliberately.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      backend-python-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend: grouped minor/patch only. ALL major bumps are ignored —
  # majors here (Vite, Tailwind, React, recharts) are breaking migrations
  # that need hands-on work, not automated PRs.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions: one grouped weekly PR (action majors are usually
  # drop-in; CI verifies before merge).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
