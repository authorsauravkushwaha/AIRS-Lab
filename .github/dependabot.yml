version: 2
updates:
  # Python (root + backend): weekly, grouped, minors/patches only.
  # Major bumps (e.g. reportlab 4 -> 5) arrive as individual reviewable PRs
  # only when they are the sole update; see groups below for everything else.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      backend-python-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend: group non-major updates; majors stay individual because they
  # routinely need code changes (Vite major bumps, React types, etc.).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
        patterns:
          - "*"
    ignore:
      # Major frontend toolchain bumps are merged deliberately, one at a time,
      # after the full CI matrix (incl. Playwright e2e) is green.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions: grouped into one weekly PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
