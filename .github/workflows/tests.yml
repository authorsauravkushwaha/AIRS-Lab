name: Tests & Release Gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
      - name: Install lint tooling
        # Pin to the same ranges as pyproject [project.optional-dependencies] dev
        run: pip install "ruff>=0.8,<1" "mypy>=1.13,<3"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy type check
        run: mypy backend/app airs_cli.py

  backend-and-cli:
    name: Backend & CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
      - run: pip install -r requirements.txt -r backend/requirements.txt
      - name: Legacy & Site Tests
        id: legacy_tests
        run: python -m pytest tests/ -q --junitxml=pytest-root.xml
      - name: Report legacy test failures
        if: failure() && steps.legacy_tests.outcome == 'failure'
        run: python scripts/annotate_junit.py pytest-root.xml
      - name: AEGIS AI LAB Backend & Enterprise Tests (with coverage gate)
        id: backend_tests
        working-directory: backend
        run: >-
          python -m pytest tests/ -q
          --cov=app --cov-report=term --cov-fail-under=80
          --junitxml=../pytest-backend.xml
      - name: Report backend test failures
        if: failure() && steps.backend_tests.outcome == 'failure'
        working-directory: backend
        run: python ../scripts/annotate_junit.py ../pytest-backend.xml
      - name: CLI Quant Finance CI Release Gate + Offline Bundle Verification
        run: |
          python -m airs_cli packs
          python -m airs_cli gate --pack quant_finance_10k --model mock-atlas-guarded --fail-under 85 --security-gate --bundle-out ci.airsbundle.zip
          python -m airs_cli verify-bundle ci.airsbundle.zip

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Type check & build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r requirements.txt -r backend/requirements.txt
      - name: Install frontend dependencies & build SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser journey
        working-directory: frontend
        run: npx playwright test
        env:
          E2E_PYTHON: python
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
