name: Tests & Release Gate
on: [push, pull_request]
jobs:
  backend-and-cli:
    name: Backend & CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r backend/requirements.txt
      - name: Legacy & Site Tests
        run: python -m pytest tests/ -q
      - name: AEGIS AI LAB v2.0 Backend & Enterprise Tests
        working-directory: backend
        run: python -m pytest tests/ -q
      - name: CLI Quant Finance CI Release Gate + Offline Bundle Verification
        run: |
          python -m airs_cli packs
          python -m airs_cli gate --pack quant_finance_10k --model mock-atlas-guarded --fail-under 85 --security-gate --bundle-out ci.airsbundle.zip
          python -m airs_cli verify-bundle ci.airsbundle.zip

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
